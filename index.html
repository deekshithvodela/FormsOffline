    <!-- Synchronous Early Theme Restoration (Eliminates Dark Mode Flash on Refresh) -->
    <script type="text/javascript">
      (function() {
        try {
          var saved = localStorage.getItem('forms_offline_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#0f172a' : '#f8fafc';
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

    <meta name="theme-color" content="#0f172a" />

    <!-- Early PWA Install Prompt Capture Hook -->
    <script type="text/javascript">
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
      });
    </script>

    <!-- Privacy-Friendly Analytics (GoatCounter) -->

    <!-- Clean Extensionless URL Restoration Script for GitHub Pages SPA -->
    <script type="text/javascript">
      (function(l) {
        if (l.search && l.search.length > 1) {
          var q = l.search.slice(1);
          var route = q.startsWith('/') ? q : '/' + q;
          var decoded = route.split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.replace(/\/+$/, '') + decoded + l.hash
          );
        }
      }(window.location));
    </script>
